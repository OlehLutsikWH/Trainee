name: View Counter desktop build

on:
  push:
    paths:
      - 'view-counter/**'
      - '.github/workflows/view-counter-desktop.yml'
    tags:
      - 'view-counter-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: view-counter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: view-counter/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: View-Counter-Windows
          path: |
            view-counter/dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/view-counter-v')
        uses: softprops/action-gh-release@v2
        with:
          files: view-counter/dist/*.exe
