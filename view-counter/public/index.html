<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Counter</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #6b7280;
      --border: #e3e6ea; --accent: #2563eb; --ok: #15803d; --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --card: #1a1d24; --text: #e8eaee; --muted: #9aa1ad;
        --border: #2c313b; --accent: #5b8def; --ok: #4ade80; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    textarea {
      width: 100%; min-height: 160px; resize: vertical; padding: 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    button:disabled { opacity: .6; cursor: wait; }
    .hint { color: var(--muted); font-size: 13px; }
    .total { font-size: 32px; font-weight: 700; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    th.num { text-align: right; }
    a { color: var(--accent); word-break: break-all; }
    .err { color: var(--err); }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>View Counter</h1>
  <p class="sub">Вставте посилання на пости — отримаєте кількість переглядів.</p>

  <section class="card">
    <textarea id="urls" placeholder="Одне посилання на рядок, наприклад:
https://www.youtube.com/watch?v=dQw4w9WgXcQ
https://t.me/durov/300
https://t.me/s/durov
https://www.tiktok.com/@user/video/1234567890
https://nv.ua/ukr/...  (новинні сайти, які показують лічильник)

Можна вставити цілу колонку з Excel — порядок рядків збережеться."></textarea>
    <div class="row">
      <button id="go">Порахувати перегляди</button>
      <span class="hint" id="status">YouTube, Telegram, TikTok і новинні сайти з лічильником переглядів</span>
    </div>
  </section>

  <section class="card" id="result" hidden>
    <div class="row" style="justify-content: space-between; margin-top: 0;">
      <div>
        <div class="muted">Загалом переглядів</div>
        <div class="total" id="total">0</div>
      </div>
      <div class="row" style="margin-top: 0;">
        <button class="secondary" id="copy" title="Скопіювати перегляди по рядках, щоб вставити в колонку Excel">Копіювати колонку переглядів</button>
        <button class="secondary" id="csv">Завантажити CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Джерело</th><th>Пост</th><th class="num">Перегляди</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString('uk-UA');
  let lastResults = [];

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function render({ totalViews, results }) {
    lastResults = results;
    $('total').textContent = fmt(totalViews);
    $('rows').innerHTML = results.map((r) => r.empty ? `
      <tr><td class="muted">${r.line}</td><td colspan="3" class="muted">порожній рядок</td></tr>` : `
      <tr>
        <td class="muted">${r.line}</td>
        <td>${escapeHtml(r.platform ?? '—')}</td>
        <td>
          ${r.title ? `<div>${escapeHtml(r.title)}</div>` : ''}
          <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
        </td>
        <td class="num">${r.ok
          ? (r.approximate ? '≈ ' : '') + fmt(r.views)
          : `<span class="err">${escapeHtml(r.error)}</span>`}</td>
      </tr>`).join('');
    $('result').hidden = false;
  }

  $('go').addEventListener('click', async () => {
    // One line = one row, blank lines kept so the order matches the spreadsheet
    const urls = $('urls').value.replace(/\s+$/, '').split(/\r?\n/).map((l) => l.trim());
    if (!urls.some(Boolean)) return $('urls').focus();
    const btn = $('go');
    btn.disabled = true;
    btn.textContent = 'Рахую…';
    $('status').textContent = `Перевіряю ${urls.filter(Boolean).length} посилань, це може зайняти кілька хвилин…`;
    try {
      const res = await fetch('/api/views', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      render(data);
    } catch (err) {
      alert(err.message || 'Помилка');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Порахувати перегляди';
      $('status').textContent = 'YouTube, Telegram, TikTok і новинні сайти з лічильником переглядів';
    }
  });

  // One value per input line (sum if a channel link expanded into several posts), blank when not found
  $('copy').addEventListener('click', async () => {
    const byLine = new Map();
    for (const r of lastResults) {
      if (!byLine.has(r.line)) byLine.set(r.line, '');
      if (r.ok) byLine.set(r.line, (Number(byLine.get(r.line)) || 0) + r.views);
    }
    const text = [...byLine.keys()].sort((a, b) => a - b).map((l) => byLine.get(l)).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      $('copy').textContent = 'Скопійовано ✓';
      setTimeout(() => { $('copy').textContent = 'Копіювати колонку переглядів'; }, 2000);
    } catch {
      alert('Не вдалося скопіювати. Скористайтеся кнопкою «Завантажити CSV».');
    }
  });

  $('csv').addEventListener('click', () => {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Рядок', 'Джерело', 'Посилання', 'Назва', 'Перегляди', 'Помилка'].map(q).join(',')];
    for (const r of lastResults) {
      lines.push([r.line, r.platform, r.url, r.title, r.ok ? r.views : '', r.ok ? '' : r.error].map(q).join(','));
    }
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'views.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
